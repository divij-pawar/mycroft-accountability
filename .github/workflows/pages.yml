# Publish the reference site (docs/) to GitHub Pages.
#
# The site is rebuilt from source on every run: scripts/build_docs.py regenerates the parts read
# off the code (file inventories, routes, environment variables, the Honest Ledger) and exits
# non-zero on any problem (an undocumented file, a broken link), so a broken site never deploys.
#
# One-time setup, in the repository: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". In the nikbearbrown/mycroft monorepo this file sits at
# verification-layer/.github/ and is inert: GitHub reads workflows only from the repository root.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the reference site (stdlib only; fails on any problem)
        run: python scripts/build_docs.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
